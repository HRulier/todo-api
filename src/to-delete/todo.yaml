components:
  schemas:
    TodoInputCreate:
      type: object
      required:
        - description
      properties:
        description:
          type: string
          description: The text description of the todo item
        date:
          type: string
          format: date-time
          description: The due date for the todo item (optional)
    TodoInputUpdate:
      type: object
      required:
        - description
      properties:
        description:
          type: string
          description: The text description of the todo item
        date:
          type: string
          format: date-time
          description: The due date for the todo item (optional)
        done:
          type: boolean
          description: The status of the todo item
    Todo:
      type: object
      properties:
        _id:
          type: string
          description: The auto-generated MongoDB id of the todo
        description:
          type: string
          description: The text description of the todo item
        date:
          type: string
          format: date-time
          description: The due date for the todo item
        user:
          type: string
          description: The user ID who owns this todo
        createdAt:
          type: string
          format: date-time
          description: Creation timestamp
        updatedAt:
          type: string
          format: date-time
          description: Last update timestamp
